tes check-in',instructions:'Ask about medicines and wellbeing.',status:'Due Today',notes:''}]};
let data;try{data=JSON.parse(localStorage.getItem('nc-v1'))||seed}catch{data=seed}let page='Dashboard',selected='',screenPatient='',regStep=1,regDraft={},lastReg=null,tab='Overview',statusFilter='All',query='',toastMsg='';const save=()=>localStorage.setItem('nc-v1',JSON.stringify(data)),pat=id=>data.patients.find(p=>p.id===id),fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—',ini=n=>(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),escapeHTML=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),refs=s=>data.referrals.filter(r=>r.status===s).length,due=()=>data.followups.filter(f=>f.date===day(0)&&f.status!=='Completed').length;

function render(){data.followups.forEach(f=>{if(!['Completed','Contacted','Rescheduled'].includes(f.status))f.status=f.date<day(0)?'Overdue':f.date===day(0)?'Due Today':'Upcoming'});save();document.getElementById('app').innerHTML=`<aside class="sidebar"><div class="brand"><i>✚</i><div>NirantarCare<small>COMMUNITY HEALTH</small></div></div><div class="navlabel">WORKSPACE</div><nav class="nav">${[['Dashboard','⌂'],['Register Patient','＋'],['All Patients','♙'],['Health Screening','♡'],['Referrals','⇢'],['Follow-up Management','◷'],['Notifications','♧'],['Reports & Analytics','▥']].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navTo('${n}')"><span class="ico">${i}</span><span>${n}</span>${n==='Notifications'&&alerts()?`<b class="badge">${alerts()}</b>`:''}</button>`).join('')}</nav><div class="navlabel">PERSONAL</div><nav class="nav"><button onclick="navTo('Settings / Profile')"><span class="ico">⚙</span><span>Settings / Profile</span></button></nav><div class="worker"><div class="avatar">AM</div><div><strong>Anita More</strong><small>ASHA worker · Dhanora</small></div></div></aside><main class="main"><header class="top"><span>${page}</span><div class="meta"><span id="network"><i class="dot"></i>Online</span><span class="village">Dhanora · Ward 2</span><span class="sync">Local data · sync not configured</span><button onclick="navTo('Notifications')">♧${alerts()?`<sup>${alerts()}</sup>`:''}</button></div></header><section class="content">${body()}</section></main>${toastMsg?`<div style="position:fixed;bottom:18px;right:18px;background:#143f3e;color:white;padding:12px 16px;border-radius:8px;z-index:9">${escapeHTML(toastMsg)}</div>`:''}`;window.ononline=()=>{let e=document.getElementById('network');if(e)e.innerHTML='<i class="dot"></i>Online · local-only'};window.onoffline=()=>{let e=document.getElementById('network');if(e)e.innerHTML='<i class="dot" style="background:#e4a94f"></i>Offline · saved on device'};if(!navigator.onLine)window.onoffline()}
function alerts(){return data.followups.filter(f=>['Due Today','Overdue','Upcoming'].includes(f.status)&&f.date<=day(2)).length}
function body(){switch(page){case'Dashboard':return dashboard();case'Register Patient':return registration();case'All Patients':return patientList();case'Health Screening':return screening();case'Facilities':return facilities();case'Referrals':return referralsPage();case'Follow-up Management':return followups();case'Notifications':return notifications();case'Reports & Analytics':return reports();case'Profile':return profile();case'Settings / Profile':return settings();default:return dashboard()}}
function dashboard(){let activity=[...data.patients.map(p=>({date:p.created,title:'Patient registered',sub:p.name,ico:'＋'})),...data.screenings.map(s=>({date:s.date,title:'Health screening',sub:(pat(s.patientId)?.name||'')+' · '+s.complaint,ico:'♡'})),...data.referrals.map(r=>({date:r.date,title:'Referral '+r.status.toLowerCase(),sub:(pat(r.patientId)?.name||'')+' · '+r.facility,ico:'⇢'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),fs=data.followups.filter(f=>f.status!=='Completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);let total=data.referrals.length||1;return `${header('Good morning, Anita','Your community health snapshot for Dhanora.',`<button class="btn" onclick="navTo('Register Patient')">＋ Register patient</button>`)}<div class="cards">${[['Registered patients',data.patients.length,'♙','All patient records'],['Screenings conducted',data.screenings.length,'♡','Saved health screenings'],['Ongoing referrals',data.referrals.filter(r=>!['Closed','Consultation Completed'].includes(r.status)).length,'⇢','Requiring next steps'],['Follow-ups due today',due(),'◷','Across your patient list']].map(x=>`<div class="card stat"><div><label>${x[0]}</label><div class="num">${x[1]}</div><small>${x[3]}</small></div><div class="staticon">${x[2]}</div></div>`).join('')}</div><div class="grid2"><div class="card"><div class="cardhead"><div><h3 class="title">Referral overview</h3><div class="hint">Patient journeys by current status</div></div><button class="link" onclick="navTo('Referrals')">View all →</button></div>${['Pending','Referred','Consultation Completed','Follow-up Required','Closed'].map(s=>`<div class="barrow"><span>${s}</span><div class="bar"><i style="width:${Math.max(3,100*refs(s)/total)}%"></i></div><b>${refs(s)}</b></div>`).join('')}</div><div class="card"><div class="cardhead"><div><h3 class="title">Upcoming follow-ups</h3><div class="hint">Your next patient check-ins</div></div><button class="link" onclick="navTo('Follow-up Management')">See all →</button></div>${fs.map(f=>`<div class="row"><div class="person">${ini(pat(f.patientId)?.name)}</div><div class="rowmain"><strong>${escapeHTML(pat(f.patientId)?.name)}</strong><small>${fmt(f.date)} · ${escapeHTML(f.reason)}</small></div>${pill(f.status)}<button class="link" onclick="openFollow('${f.id}')">Open</button></div>`).join('')||'<div class="empty">No follow-ups scheduled</div>'}</div></div><div class="grid2"><div class="card"><div class="cardhead"><div><h3 class="title">Recent patient activity</h3><div class="hint">Latest updates across your care list</div></div><button class="link" onclick="navTo('All Patients')">All patients →</button></div>${activity.map(a=>`<div class="row"><div class="person">${a.ico}</div><div class="rowmain"><strong>${a.title}</strong><small>${escapeHTML(a.sub)}</small></div><small class="sub">${fmt(a.date)}</small></div>`).join('')}</div><div class="card"><div class="cardhead"><div><h3 class="title">Quick actions</h3><div class="hint">Get care coordination moving</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${[['＋','Register patient',"navTo('Register Patient')"],['♡','Start screening',"navTo('Health Screening')"],['⌕','Search patient',"navTo('All Patients')"],['⇢','Create referral',"navTo('Referrals')"]].map(x=>`<button class="btn secondary" style="text-align:left" onclick="${x[2]}">${x[0]} ${x[1]}</button>`).join('')}</div><div class="notice">Preliminary screening does not replace a clinician's assessment.</div></div></div>`}
function registration(){if(lastReg)return `${header('Patient registered','A new patient record is saved on this device.')}<div class="card" style="text-align:center;padding:34px"><div class="avatar" style="margin:auto;width:52px;height:52px">✓</div><h2>${escapeHTML(lastReg.name)} is registered</h2><p>Patient ID: <b>${lastReg.id}</b> · ${escapeHTML(lastReg.village)}</p><button class="btn" onclick="goPatient('${lastReg.id}')">View patient profile</button> <button class="btn soft" onclick="startScreen('${lastReg.id}')">Start screening</button><p><button class="link" onclick="lastReg=null;regStep=1;regDraft={};render()">Register another patient</button></p></div>`;let fields=regStep===1?[field('Full name','name','text','e.g. Sita Ram',true),field('Age','age','number','Years',true),field('Gender','gender','select','',true,['Female','Male','Other','Prefer not to say']),field('Mobile number','phone','tel','10-digit number',true),field('Village','village','text','Village',true),field('Address','address','text','House, landmark'),field('Emergency contact','emergency','tel','Contact number')].join(''):regStep===2?[field('Existing medical conditions','conditions','text','e.g. diabetes'),field('Known allergies','allergies','text','List known allergies'),field('Current medications','medications','text','Medicines taken'),field('Previous medical history','history','textarea','Relevant history'),field('Accessibility / assistance needs','access','textarea','Travel or communication support')].join(''):`<div class="field full"><div class="notice">Explain how information supports screening, care referrals and follow-up.</div><label><input name="consent" type="checkbox" required> Patient consents to storing health information.</label><label><input name="refConsent" type="checkbox" required> Patient consents to relevant referrals and follow-up communication.</label></div>`;return `${header('Register a patient','Create a patient record. You can save offline and sync when connected.')}<div class="card" style="max-width:800px"><div class="steps">${['Personal information','Additional information','Consent'].map((s,i)=>`<span class="step ${regStep===i+1?'active':''}">${i+1}. ${s}</span>`).join('')}</div><form id="reg" onsubmit="event.preventDefault();regNext()"><div class="formgrid">${fields}</div><div class="actions">${regStep>1?'<button type="button" class="btn secondary" onclick="regBack()">← Back</button>':'<span></span>'}<button class="btn">${regStep<3?'Continue →':'Save patient'}</button></div></form></div>`}

function profile(){let p=pat(selected);if(!p){page='All Patients';return patientList()}let ss=data.screenings.filter(s=>s.patientId===p.id).sort((a,b)=>b.date.localeCompare(a.date)),rr=data.referrals.filter(r=>r.patientId===p.id),ff=data.followups.filter(f=>f.patientId===p.id).sort((a,b)=>b.date.localeCompare(a.date)),r=rr[0];let main=tab==='Overview'?`<div class="grid2" style="margin-top:0"><div class="card"><h3 class="title">Personal information</h3><div class="formgrid" style="margin-top:14px">${[['Patient ID',p.id],['Age / gender',p.age+' · '+p.gender],['Mobile',p.phone],['Village',p.village],['Address',p.address],['Emergency',p.emergency]].map(x=>`<div><div class="hint">${x[0]}</div><b style="font-size:11px">${escapeHTML(x[1])}</b></div>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="hint">Conditions · Allergies · Medication</div><p style="font-size:10px">${escapeHTML([p.conditions,p.allergies,p.medications].filter(Boolean).join(' · ')||'No additional information')}</p></div><div class="card"><h3 class="title">Current care</h3><div class="row"><div class="person">♡</div><div class="rowmain"><strong>Latest screening</strong><small>${ss[0]?fmt(ss[0].date)+' · '+escapeHTML(ss[0].complaint):'None recorded'}</small></div></div><div class="row"><div class="person">⇢</div><div class="rowmain"><strong>Referral status</strong><small>${escapeHTML(r?.facility||'No active referral')}</small></div>${r?pill(r.status):''}</div><div class="row"><div class="person">◷</div><div class="rowmain"><strong>Next follow-up</strong><small>${fmt(ff.find(f=>f.status!=='Completed')?.date)}</small></div></div></div></div><div class="card" style="margin-top:14px"><h3 class="title">Patient journey</h3><div class="timeline">${[...ss.map(x=>({d:x.date,t:'Screening · '+x.complaint,sub:'BP '+(x.bp||'—')+' · '+x.risk})),...rr.map(x=>({d:x.date,t:'Referral · '+x.status,sub:x.facility+' · '+x.reason})),...ff.map(x=>({d:x.date,t:'Follow-up · '+x.status,sub:x.reason+' '+(x.response||'')}))].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="event"><strong>${escapeHTML(x.t)}</strong><small>${fmt(x.d)} · ${escapeHTML(x.sub)}</small></div>`).join('')||'No care activity yet.'}</div></div>`:tab==='Screening History'?ss.map(s=>`<div class="card" style="margin-bottom:10px"><div class="cardhead"><div><h3 class="title">${escapeHTML(s.complaint)}</h3><div class="hint">${s.id} · ${fmt(s.date)} · ${escapeHTML(s.duration)}</div></div>${pill(s.risk)}</div><p style="font-size:10px">${escapeHTML(s.symptoms)} · ${escapeHTML(s.severity)}</p><div style="font-size:10px">BP <b>${escapeHTML(s.bp)}</b>　Temp <b>${escapeHTML(s.temp)}</b>　Heart rate <b>${escapeHTML(s.heart)}</b>　Glucose <b>${escapeHTML(s.glucose)}</b></div><p class="hint">${escapeHTML(s.insight)}</p>${s.report?`<div class="hint">Attachment: ${escapeHTML(s.report)}</div>`:''}</div>`).join('')||'<div class="card empty">No screenings recorded</div>':tab==='Referral History'?rr.map(x=>`<div class="card" style="margin-bottom:10px"><div class="cardhead"><div><h3 class="title">${escapeHTML(x.facility)}</h3><div class="hint">${x.id} · ${fmt(x.date)}</div></div>${pill(x.status)}</div><div style="font-size:10px">${escapeHTML(x.reason)}</div><div class="timeline">${x.timeline.map(t=>`<div class="event"><strong>${escapeHTML(t.status)}</strong><small>${fmt(t.date)} · ${escapeHTML(t.note)}</small></div>`).join('')}</div>${x.consult?`<div class="notice"><b>Verified consultation · ${escapeHTML(x.consult.doctor||'Facility clinician')}</b><br>${escapeHTML(x.consult.diagnosis)} · Follow-up ${fmt(x.consult.next)}</div>`:''}</div>`).join('')||'<div class="card empty">No referrals yet</div>':tab==='Medical History'?`<div class="card"><h3 class="title">Patient-reported history</h3><p style="font-size:10px">${escapeHTML(p.history||'No previous history recorded')}<br>Conditions: ${escapeHTML(p.conditions||'None recorded')} · Allergies: ${escapeHTML(p.allergies||'None recorded')}</p>${rr.filter(x=>x.consult).map(x=>`<div class="row"><div class="person">✚</div><div class="rowmain"><strong>${escapeHTML(x.consult.diagnosis)}</strong><small>Clinician entered · ${fmt(x.consult.date)} · ${escapeHTML(x.facility)}</small></div></div>`).join('')}</div>`:ff.map(f=>`<div class="card" style="margin-bottom:10px"><div class="cardhead"><div><h3 class="title">${escapeHTML(f.reason)}</h3><div class="hint">Scheduled ${fmt(f.date)} ${f.contactedAt?'· Contacted '+new Date(f.contactedAt).toLocaleString():''}</div></div>${pill(f.status)}</div><div style="font-size:10px">${escapeHTML(f.notes||'No contact notes')}</div><div class="hint">${escapeHTML(f.instructions)}</div></div>`).join('')||'<div class="card empty">No follow-up history</div>';return `${header(escapeHTML(p.name),`${p.id} · ${p.age} years · ${escapeHTML(p.village)}`,`<button class="btn secondary" onclick="navTo('All Patients')">← All patients</button>`)}<div style="display:flex;gap:7px;margin:-5px 0 14px;flex-wrap:wrap"><button class="btn" onclick="startScreen('${p.id}')">♡ Start screening</button><button class="btn soft" onclick="selected='${p.id}';page='Facilities';render()">⇢ Find facility</button><button class="btn secondary" onclick="scheduleFollowFor('${p.id}')">◷ Schedule follow-up</button></div><div class="tabs">${['Overview','Screening History','Referral History','Medical History','Follow-up History'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>${main}`}
function scheduleFollowFor(id){selected=id;scheduleFollow()}
function settings(){return `${header('Settings & profile','ASHA worker profile and local data controls.')}<div class="grid2"><div class="card"><h3 class="title">Worker profile</h3><div class="formgrid" style="margin-top:14px">${[['Name','Anita More'],['Role','ASHA worker'],['Village','Dhanora'],['Service area','Ward 2'],['Facility contact','Dhanora CHC']].map(x=>`<div class="field"><label>${x[0]}</label><input value="${x[1]}" disabled></div>`).join('')}</div></div><div class="card"><h3 class="title">Offline & data</h3><div class="notice">Records are stored in this browser on this device. Unsynchronised screening records: ${data.screenings.filter(s=>!s.sync).length}.</div><button class="btn soft" onclick="toast('Local records are saved on this device')">↻ Check sync status</button><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><button class="btn secondary" onclick="if(confirm('Restore demo records? Locally added records will be removed.')){localStorage.removeItem('nc-v1');location.reload()}">Restore demo data</button></div></div>`}
render();
</script></body></html>
